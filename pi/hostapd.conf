# ================================
# DEPOT — wireless access point config for the Raspberry Pi
# ================================
# WHAT THIS FILE IS:
# This is the config for "hostapd" — the Linux program that turns the Pi's
# Wi-Fi chip from a "listener" (sees networks) into a "broadcaster" (IS a network).
#
# Think of it as this: a normal Wi-Fi chip is like a walkie-talkie receiver.
# hostapd makes it act like a walkie-talkie base station that everyone can join.
#
# The Pi reads this file when the service "hostapd-depot.service" starts.

# ---- WHICH HARDWARE ----
# The Pi's Wi-Fi "interface" is called wlan0. It's like a door name:
# wlan0 = the built-in Wi-Fi antenna port on the Pi.
interface=wlan0

# nl80211 is the "driver" — the standard modern way Linux talks to Wi-Fi chips.
# (You basically always leave this as nl80211 on a Raspberry Pi.)
driver=nl80211

# ---- THE NETWORK IDENTITY ----
# This is the Wi-Fi network name (SSID) that shows up when people scan for
# networks on their phone. We chose "depot" for this project.
ssid=depot

# ---- WHICH RADIO SETTINGS ----
# channel = which "lane" of the 2.4 GHz band we broadcast on.
# 2.4 GHz spectrum runs from channel 1 to channel 13, like 13 radios on
# slightly different frequencies. We picked channel 1 (2412 MHz) because it's
# far away from channel 11 (which is often crowded, e.g. by the phone hotspot).
channel=1

# "IN" = India — this tells hostapd which country we're in, so it only uses
# frequencies and power levels LEGAL in India. Every country has its own rules.
country_code=IN

# hw_mode=g = "2.4 GHz band" mode. Old but ultra-compatible — every phone and
# laptop made in the last decade works with it.
# ieee80211n=1 = allows 802.11n (Wi-Fi 4) speeds on top of that — a bit faster.
hw_mode=g
ieee80211n=1

# ---- SECURITY (THE "PASSWORD") ----
# wpa=2 means "use WPA2" — the standard Wi-Fi password protection everyone knows.
# (WPA3 is newer but old Pi Wi-Fi chips don't support it — that's fine,
# WPA2 with a good password is still secure for a private LAN.)
wpa=2

# The Wi-Fi password people need to type to join. For this project: "depot321"
# NOTE: keep this simple (letters + numbers). Weird symbols like ! or symbols
# sometimes confuse old phone builds — that's an actual bug we hit.
wpa_passphrase=depot321

# wpa_key_mgmt=WPA-PSK: PSK means "Pre-Shared Key" → one shared password for
# everyone, not per-person usernames (like when your friends join your home Wi-Fi).
wpa_key_mgmt=WPA-PSK

# CCMP is the encryption algorithm (the modern "AES" one). We list it twice
# (once as wpa_pairwise, once as rsn_pairwise) to make sure ONLY this algorithm
# is allowed — no old weak ciphers like TKIP. Some old Broadcom chips misbehave
# when you don't pin this down, which is exactly what we hit in testing.
wpa_pairwise=CCMP
rsn_pairwise=CCMP

# ---- EXTRA POLICY ----
# macaddr_acl=0 = "don't filter devices by MAC address" — anyone who knows the
# password can join. (A "MAC allowlist" would be mode 1 — not needed here.)
macaddr_acl=0

# auth_algs=1 = allow "open system authentication" — the normal modern way
# devices say hello to a WPA2 network. (Mode 2 would be "shared key", ancient.)
auth_algs=1

# ignore_broadcast_ssid=0 = "don't hide the network" — anyone in range sees
# "depot" in their phone's Wi-Fi list. (Set to 1 and you'd need to type the
# name manually — a niche privacy feature we don't want here.)
ignore_broadcast_ssid=0

# ================================
# TROUBLESHOOTING NOTES (from when we built this)
# ================================
# - NetworkManager (the normal Linux Wi-Fi manager) fights with hostapd over
#   control of wlan0. That's why we run `nmcli dev set wlan0 managed no` once,
#   and start hostapd through systemd directly.
# - If the AP doesn't appear: `systemctl status hostapd-depot` and
#   `journalctl -u hostapd-depot -n 20` will tell you why (
#   most common cause: NetworkManager hogging wlan0, or bad psk symbols).
