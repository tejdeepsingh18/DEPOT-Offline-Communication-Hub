# ==========================================
# DEPOT — DHCP config for the Pi's Wi-Fi network
# ==========================================
# WHAT THIS FILE IS:
# When a phone connects to a Wi-Fi network, it doesn't magically know which
# address to use on that network. It SHOUTS into the network:
#     "Hello? I'm a new device — can someone give me an IP?"
#
# dnsmasq is the program that answers that shout. It's called a "DHCP server".
# (DHCP = "Dynamic Host Configuration Protocol" = the shouting/answering rules.)
#
# So in plain words:
#     hostapd  = makes the Wi-Fi network exist
#     dnsmasq  = gives IPs to devices that join that network
#
# The Pi reads this file when the service "dnsmasq-depot.service" starts.

# ---- WHICH INTERFACE TO SERVE ON ----
# Talk on the same Wi-Fi antenna that hostapd is using (wlan0).
# We bind so dnsmasq ONLY ever answers join requests on the Pi's own Wi-Fi —
# not on the ethernet cable or anywhere else on the laptop.
interface=wlan0
bind-interfaces

# ---- WHICH IPs TO HAND OUT ----
# Anyone connecting to "depot" gets an address between:
#     10.42.0.50   (start)    and    10.42.0.100 (stop)
# A 12h lease means "you can keep this address for 12 hours, then we'll re-check".
# (It's like handing out locker numbers to everyone who walks into the depot.)
#
# The Pi itself is 10.42.0.1 — that's set inside hostapd-depot.service.
dhcp-range=10.42.0.50,10.42.0.100,12h

# ---- WHAT DNS SERVER TO TEACH JOINING DEVICES ----
# When phone A asks "where is the chat server?", we want the answer to ALWAYS be
# "10.42.0.1" (the Pi itself). This setting pushes that answer down the pipe
# when devices join.
dhcp-option=6,10.42.0.1

# ---- LOCAL NICKNAME ----
# Lets people also type "http://depot" instead of "http://10.42.0.1" in their
# browser. Convenience only — both work on our client app.
address=/depot/10.42.0.1

# ---- DNS UPSTREAM (TO THE LAPTOP'S HOTSPOT, NOT THE INTERNET AT LARGE) ----
# This Pi will only ever be on a dev desk plugged into the laptop over ethernet,
# so we let it know about the laptop's phone hotspot's DNS address for any
# OTHER DNS queries (like apt install). During real field use — with NO
# ethernet plugged in — this setting has no effect at all.
no-resolv
server=10.146.80.241

# ---- DEBUG LOGGING ----
# Log every DNS query and DHCP handshake. Useful when something on the AP side
# chokes; you can literally watch a phone join on the Pi's screen by running:
#     journalctl -u dnsmasq-depot -f
log-queries
log-dhcp

# ==========================================
# TROUBLESHOOTING NOTES (from when we built this)
# ==========================================
# - Worst bug we hit here: another instance of dnsmasq secretly running
#   (spawned by NetworkManager behind our back when the hotspot profile got
#   re-enabled). It hogged port 53 on 10.42.0.1 and our proper dnsmasq
#   crashed on startup with "Address already in use".
#   FIX: kill the ghost, and `nmcli dev delete` the NetworkManager profile.
